{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Selection Footwear{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Swiper CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- Owl Carousel -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">

    <link rel="stylesheet"
   
   
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">


    <link rel="stylesheet" href="{% static 'css/popup.css' %}">
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">
<link rel="stylesheet" href="{% static 'css/home.css' %}">
<link rel="stylesheet" href="{% static 'css/shopnow.css' %}">
<link rel="stylesheet" href="{% static 'css/shoes.css' %}">
<link rel="stylesheet" href="{% static 'css/banner.css' %}">
<link rel="stylesheet" href="{% static 'css/categories.css' %}">
<link rel="stylesheet" href="{% static 'css/discover.css' %}">
<link rel="stylesheet" href="{% static 'css/whychoose.css' %}">
<link rel="stylesheet" href="{% static 'css/features.css' %}">
<link rel="stylesheet" href="{% static 'css/testinomial.css' %}">
<link rel="stylesheet" href="{% static 'css/footer.css' %}">
<link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    {% block extra_css %}
    {% endblock %}

</head>

<body class="{% block body_class %}{% endblock %}">

    {% include 'includes/navbar.html' %}

    <main id="contentarea">
        {% block content %}
        {% endblock %}
    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Owl Carousel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Project JS -->
    <script src="{% static 'js/banner.js' %}" defer></script>
    <script src="{% static 'js/category-slider.js' %}" defer></script>
    <script src="{% static 'js/testimonial.js' %}" defer></script>
    <script src="{% static 'js/popup.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
