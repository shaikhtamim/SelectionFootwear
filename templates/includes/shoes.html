<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop by Category</title>
    <link rel="stylesheet" href="shoes.css">
</head>
<body>

<!-- SHOP BY CATEGORY SECTION -->
<section class="sf-category-section">
    <div class="sf-category-container">

        <!-- Heading -->
        <h2 class="sf-category-heading">Shop by Category</h2>

        <!-- Grid Container -->
        <div class="sf-category-grid">

            <!-- Category 1: Heels -->
            <div class="sf-category-card">
                <div class="sf-category-icon icon-heels"></div>
                <span>Heels</span>
            </div>

            <!-- Category 2: Flats -->
            <div class="sf-category-card">
                <div class="sf-category-icon icon-flats"></div>
                <span>Flats</span>
            </div>

            <!-- Category 3: Sandals -->
            <div class="sf-category-card">
                <div class="sf-category-icon icon-sandals"></div>
                <span>Sandals</span>
            </div>

            <!-- Category 4: Sneakers -->
            <div class="sf-category-card">
                <div class="sf-category-icon icon-sneakers"></div>
                <span>Sneakers</span>
            </div>

            <!-- Category 5: Boots -->
            <div class="sf-category-card">
                <div class="sf-category-icon icon-boots"></div>
                <span>Boots</span>
            </div>

            <!-- Category 6: Party Shoes -->
            <div class="sf-category-card">
                <div class="sf-category-icon icon-party"></div>
                <span>Party Shoes</span>
            </div>

        </div>

    </div>
</section>

</body>
</html>
